services:
  # Serviço Ollama para rodar modelos locais
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    tty: true
    volumes:
      - /home/nicksson/app/ollama:/root/.ollama
      - ./install-ollama-models.sh:/usr/local/bin/install-ollama-models.sh
    pull_policy: always
    ports:
      - "11434:11434"
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/nicksson/app/open-webui:/app/backend/data
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434