[tool.poetry]
name = "genai"
version = "0.0.1"
description = "Generative AI Projects"
authors = ["Nicksson Freitas <nickssonarrais@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/nickssonfreitas/genai"
homepage = "https://github.com/nickssonfreitas/genai"

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.2.0"
transformers = "^4.38.2"
langchain = "^0.1.0"
llama-index = "^0.9.0"
openai = "^1.2.0"
faiss-cpu = "^1.7.4"
sentence-transformers = "^2.3.0"
numpy = "^1.24.3"
pandas = "^1.5.3"
tqdm = "^4.64.1"
fastapi = "^0.115.11"
uvicorn = "^0.34.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.2.0"
black = "^23.1.0"
mypy = "^1.1.1"
pre-commit = "^3.6.0"
isort = "^5.12.0"

[tool.black]
line-length = 88
target-version = ['py311']
skip-string-normalization = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # Erros do Pyflakes
    "F",  # Erros do Pyflakes
    "I",  # Importações desorganizadas
    "B",  # Boas práticas do flake8-bugbear
    "PL", # Padrões do Pylint
    "UP", # Melhorias de código
]
ignore = [
    "B008", # Evita usar `function` diretamente como argumento
    "PLR0913", # Permite mais de 5 argumentos por função
]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
